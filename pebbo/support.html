<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebbo Support</title>
<style>
  :root { color-scheme: light dark; --pink: #d6457f; }
  body { font: 16px/1.6 -apple-system, system-ui, sans-serif; margin: 0; background: #fff; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; }
  .updated { opacity: .65; font-size: 14px; margin-bottom: 24px; }
  a { color: var(--pink); }
</style>
</head>
<body>
<main>
  <h1>Pebbo Support</h1>
  <p>Questions, bugs or purchase problems? Email <a href="mailto:admin@aumic.app">admin@aumic.app</a>.</p>
  <h2>Restore a purchase</h2>
  <p>If Pebbo Plus is not unlocked after a reinstall, open the Pebbo menu in the menu bar and choose Restore Purchases.</p>
</main>
</body>
</html>
